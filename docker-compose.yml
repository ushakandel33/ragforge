version: "3.9"

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - chroma_data:/app/data/chroma_db
      - cache_data:/app/data/response_cache
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import httpx; httpx.get('http://localhost:8000/health').raise_for_status()"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  ui:
    build:
      context: .
      dockerfile: Dockerfile.ui
    ports:
      - "8501:8501"
    environment:
      - BACKEND_URL=http://api:8000
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  # Optional: local open-source model server (requires NVIDIA GPU + nvidia-container-toolkit).
  # Run with: docker compose --profile local-model up
  vllm:
    image: vllm/vllm-openai:latest
    profiles: ["local-model"]
    command: ["--model", "mistralai/Mistral-7B-Instruct-v0.2", "--port", "8001"]
    ports:
      - "8001:8001"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    volumes:
      - hf_cache:/root/.cache/huggingface

volumes:
  chroma_data:
  cache_data:
  hf_cache:
